# Tuner by LumaNest TV for Apple TV. Generate the Xcode project with:  xcodegen generate   (in apps/tvos)
# The generated Tuner.xcodeproj and Tuner/Info.plist are not committed; this file is the source of truth.
# Signing: put your team id in Config/Signing.local.xcconfig (gitignored), see README.md.
name: Tuner
options:
  bundleIdPrefix: app.tunertv
  deploymentTarget:
    tvOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  TunerCore:
    path: TunerCore
targets:
  Tuner:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Tuner.xcconfig
      Release: Config/Tuner.xcconfig
    sources:
      - path: Tuner
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Tuner/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TunerCore
    info:
      path: Tuner/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        # Provider servers are HTTP-only and redirect to per-session IP addresses, and the app plays through its own
        # http://127.0.0.1 server. Only this one ATS key: any other global ATS key makes ATS ignore it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunertv
        PRODUCT_NAME: Tuner
        TARGETED_DEVICE_FAMILY: "3"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Debug:
          DEAD_CODE_STRIPPING: NO
        Release:
          DEAD_CODE_STRIPPING: YES
  TunerTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: TunerTests
    dependencies:
      - target: Tuner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tunertv.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        # TunerCore is linked into the app only (adding it here too would duplicate it); its module is found here.
        SWIFT_INCLUDE_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)"
schemes:
  Tuner:
    build:
      targets:
        Tuner: all
        TunerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TunerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    ignore:
      # AGP 9 needs Gradle 9.6+ and a build-script migration; upgrade it deliberately.
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directories: [/site, /apps/tizen, /apps/webos]
    schedule:
      interval: weekly

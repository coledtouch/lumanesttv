version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    ignore:
      # AGP 9 needs Gradle 9.6+ and a build-script migration; upgrade it deliberately.
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directories: [/site, /apps/tizen, /apps/webos]
    schedule:
      interval: weekly
    ignore:
      # Newer wrangler expects @cloudflare/workers-types 5, whose globals clash with Node's Buffer
      # types in lib/owner-auth.ts; move both together in a dedicated change.
      - dependency-name: wrangler
        update-types: [version-update:semver-minor]
      - dependency-name: "@cloudflare/workers-types"
        update-types: [version-update:semver-major]

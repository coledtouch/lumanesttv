name: Android

on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'docs/browse-cases.json', 'docs/extras-cases.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'docs/browse-cases.json', 'docs/extras-cases.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Reject a tampered gradle-wrapper.jar before any wrapper code runs.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Make the checked-in wrapper executable
        run: chmod +x gradlew
      - name: Unit tests, lint and unsigned release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      # RegexPatternsTest writes every regex the app builds; the icu job below compiles them as a device would.
      - name: Save the app's regexes for the ICU check
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-regex-patterns
          path: apps/android/app/build/regex-patterns/patterns.json
          if-no-files-found: error
          retention-days: 7
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-test-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
      - name: Save unsigned release for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-unsigned-release
          path: apps/android/app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      # The Google Play / Amazon Appstore edition (-Pstore=true), after the lumanest.tv APK above is saved.
      # Its own test classes run in store mode too: they check the store manifest (TV only, no picture-in-picture),
      # Settings and the content rules. The other tests describe the lumanest.tv edition.
      # Unsigned here: the owner builds the signed AAB locally with the existing release key.
      - name: Store edition tests and bundle (Google Play)
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'tv.lumanest.tuner.StoreEdition*' bundleRelease -Pstore=true
      - name: Save store edition test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-store-test-reports
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # Android compiles java.util.regex patterns with ICU, which rejects some patterns the JVM accepts (1.7.0 crashed at
  # launch on a bare `}` that every unit test accepted). Compile every regex the app builds with ICU, using the
  # NSRegularExpression of the Swift image the Apple TV Linux job uses (ICU's uregex, as on devices).
  icu:
    name: App regexes compile with ICU (as on devices)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: swift:6.3.3-noble@sha256:c2f3ac2eb806ce43f68859c3d52bd3bb1cfc88672fb3a948b76e136d98e39278
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: apps/android/tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-regex-patterns
          path: regex-patterns
      - name: Compile every app regex with ICU
        run: |
          swiftc -O apps/android/tools/icu-check.swift -o icu-check
          ./icu-check regex-patterns/patterns.json 80

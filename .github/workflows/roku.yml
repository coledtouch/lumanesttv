name: Roku

on:
  push:
    branches: [main]
    paths: ['apps/roku/**', '.github/workflows/roku.yml']
  pull_request:
    paths: ['apps/roku/**', '.github/workflows/roku.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roku-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/roku
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned validation dependencies
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Check Roku channel source
        run: npm run check
      - name: Test
        run: npm test
      - name: Package the channel ZIP without a Roku connection
        run: npm run build
      - name: Save channel package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roku-channel-package
          path: output/roku/
          if-no-files-found: error
          retention-days: 7

name: Samsung Tizen

on:
  push:
    branches: [main]
    paths: ['apps/tizen/**', 'docs/browse-cases.json', 'docs/extras-cases.json', '.github/workflows/tizen.yml']
  pull_request:
    paths: ['apps/tizen/**', 'docs/browse-cases.json', 'docs/extras-cases.json', '.github/workflows/tizen.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tizen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/tizen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned validation dependency
        run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Check widget source
        run: npm run check
      - name: Test
        run: npm test
      - name: Build an unsigned review widget
        run: npm run build
      - name: Save unsigned widget
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tizen-unsigned-widget
          path: output/tizen/*-UNSIGNED.wgt
          if-no-files-found: error
          retention-days: 7

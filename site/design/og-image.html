<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:'DM Sans',sans-serif;color:#f8f5ee;
background:radial-gradient(900px 600px at 85% 20%,#3b2566 0%,transparent 60%),linear-gradient(135deg,#141224 0%,#1d1630 55%,#2a1d45 100%);position:relative}
.left{position:absolute;left:80px;top:64px;width:620px}
.logo{height:56px}
.eyebrow{margin-top:52px;font-size:17px;letter-spacing:4px;font-weight:600;color:#c4b5fd;display:flex;align-items:center;gap:12px}
.eyebrow:before{content:"";width:9px;height:9px;border-radius:50%;background:#a78bfa}
h1{margin-top:22px;font-family:'Manrope',sans-serif;font-weight:700;font-size:86px;line-height:.98;letter-spacing:-4px}
h1 em{font-family:Georgia,serif;font-weight:400;letter-spacing:-2px;color:#b794f6}
p{margin-top:24px;font-size:25px;line-height:1.35;color:#d9d3e6;max-width:600px}
.chips{position:absolute;left:80px;bottom:54px;display:flex;gap:12px}
.chip{border:1.5px solid #4b3a70;background:#ffffff0d;border-radius:999px;padding:11px 20px;font-size:20px;font-weight:500;color:#ece6f7}
.chip b{color:#c4b5fd;font-weight:600}
.art{position:absolute;right:70px;top:70px;width:400px;height:490px;border-radius:200px 200px 26px 26px;background:linear-gradient(180deg,#2f2350,#3a2a5e);border:10px solid #3d2d63;overflow:hidden;box-shadow:0 30px 80px #0008}
.win{position:absolute;left:46px;right:46px;top:46px;height:250px;border-radius:150px 150px 0 0;border:12px solid #19142a;background:linear-gradient(180deg,#463470,#5b4590)}
.win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#19142a}
.moon{position:absolute;right:42px;top:46px;width:78px;height:78px;border-radius:50%;background:#ddd0fb;box-shadow:0 0 50px #ddd0fb88}
.hill{position:absolute;left:0;right:0;bottom:0;height:70px;background:#6a54a3;clip-path:polygon(0 60%,35% 20%,60% 55%,100% 10%,100% 100%,0 100%)}
.tv{position:absolute;left:58px;right:58px;top:230px;height:150px;border-radius:14px;background:#7c3aed;border:9px solid #141224;display:grid;place-items:center;box-shadow:0 0 60px #7c3aed88}
.play{width:62px;height:62px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center}
.play:after{content:"";margin-left:6px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.sofa{position:absolute;left:24px;right:24px;bottom:22px;height:70px;border-radius:22px 22px 10px 10px;background:#a78bdb}
.lamp{position:absolute;right:30px;bottom:92px;width:4px;height:80px;background:#e9d9a8}
.lamp:before{content:"";position:absolute;left:-22px;top:-30px;width:48px;height:34px;background:#f1e3b4;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
</style></head><body>
<div class="left"><img class="logo" src="../public/logo.png"><div class="eyebrow">YOUR EVENING. YOUR CHANNEL.</div>
<h1>Make yourself<br>at <em>home.</em></h1>
<p>Live channels, movies and series on your TV, phone and browser.</p></div>
<div class="chips"><div class="chip"><b>1–4</b> screens</div><div class="chip">From <b>$35</b></div><div class="chip">lumanest.tv</div></div>
<div class="art"><div class="win"><div class="moon"></div><div class="hill"></div></div><div class="tv"><div class="play"></div></div><div class="lamp"></div><div class="sofa"></div></div>
</body></html>

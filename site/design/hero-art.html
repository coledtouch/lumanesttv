<!doctype html><html><head><meta charset="utf-8">
<!-- Source for public/hero-art.png: the share image's illustration (og-image.html), drawn alone at the hero's
     landscape proportions. Screenshot the .art element at deviceScaleFactor 2 with a transparent background. -->
<style>
*{box-sizing:border-box;margin:0}
body{background:transparent;padding:0}
.art{position:relative;width:600px;height:480px;border-radius:170px 170px 22px 22px;background:linear-gradient(180deg,#2f2350,#3a2a5e);border:10px solid #3d2d63;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(420px 300px at 70% 30%,#4b3580 0%,transparent 70%)}
.win{position:absolute;left:70px;right:70px;top:48px;height:250px;border-radius:200px 200px 0 0;border:12px solid #19142a;background:linear-gradient(180deg,#463470,#5b4590);overflow:hidden;z-index:0}
.win:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:#19142a;z-index:1}
.moon{position:absolute;right:58px;top:42px;width:76px;height:76px;border-radius:50%;background:#ddd0fb;box-shadow:0 0 50px #ddd0fb88}
.hill{position:absolute;left:0;right:0;bottom:0;height:64px;background:#6a54a3;clip-path:polygon(0 60%,35% 20%,60% 55%,100% 10%,100% 100%,0 100%)}
.tv{position:absolute;left:150px;width:300px;top:214px;height:160px;border-radius:14px;background:#7c3aed;border:9px solid #141224;display:grid;place-items:center;box-shadow:0 0 60px #7c3aed88}
.play{width:62px;height:62px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center}
.play:after{content:"";margin-left:6px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.sofa{position:absolute;left:44px;right:120px;bottom:22px;height:76px;border-radius:24px 24px 10px 10px;background:#a78bdb}
.sofa:before{content:"";position:absolute;left:-14px;right:-14px;bottom:0;height:44px;border-radius:18px;background:#9a7dd2}
.lamp{position:absolute;right:56px;bottom:22px;width:5px;height:150px;background:#e9d9a8}
.lamp:before{content:"";position:absolute;left:-26px;top:-36px;width:56px;height:40px;background:#f1e3b4;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.lamp:after{content:"";position:absolute;left:-60px;top:-10px;width:124px;height:124px;border-radius:50%;background:radial-gradient(#f1e3b455,transparent 70%)}
</style></head><body>
<div class="art"><div class="glow"></div><div class="win"><div class="moon"></div><div class="hill"></div></div><div class="tv"><div class="play"></div></div><div class="lamp"></div><div class="sofa"></div></div>
</body></html>
